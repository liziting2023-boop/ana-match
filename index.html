<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANA-Match · 知识问答</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--s1:#0e1520;--s2:#141d2e;--b:rgba(99,179,237,.12);--a:#3b82f6;--ag:rgba(59,130,246,.25);--a2:#06b6d4;--t:#e2eaf5;--tm:#6b87a8;--td:#3d5470;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.o1{width:500px;height:500px;background:radial-gradient(circle,rgba(59,130,246,.12),transparent 70%);top:-100px;right:-100px;}
.o2{width:400px;height:400px;background:radial-gradient(circle,rgba(6,182,212,.08),transparent 70%);bottom:-50px;left:-50px;}
.wrap{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:0 22px;}
header{padding:28px 0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);margin-bottom:32px;}
.lg{display:flex;align-items:center;gap:12px;}
.li{width:36px;height:36px;background:linear-gradient(135deg,var(--a),var(--a2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 16px var(--ag);}
.lt{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;}.lt span{color:var(--a);}
.hb{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--a2);background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.2);padding:4px 10px;border-radius:100px;}
.hero{text-align:center;margin-bottom:32px;animation:fu .6s ease both;}
.ey{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--a);margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:7px;}
.ey::before,.ey::after{content:'';width:26px;height:1px;background:var(--a);opacity:.4;}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(22px,4vw,38px);line-height:1.15;letter-spacing:-.8px;margin-bottom:12px;}
h1 em{font-style:normal;background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hp{color:var(--tm);font-size:14px;max-width:460px;margin:0 auto;line-height:1.7;}
.rgs{display:flex;justify-content:center;gap:9px;margin-top:16px;flex-wrap:wrap;}
.rt{font-size:11px;color:var(--tm);background:var(--s1);border:1px solid var(--b);padding:4px 12px;border-radius:100px;display:flex;align-items:center;gap:5px;}
.rd{width:5px;height:5px;border-radius:50%;}.de{background:#60a5fa;}.dn{background:#34d399;}.da{background:#f59e0b;}
.cp{background:var(--s1);border:1px solid var(--b);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:500px;animation:fu .6s ease .15s both;}
.ph{padding:15px 20px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:9px;}
.pi{width:27px;height:27px;background:var(--s2);border:1px solid var(--b);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;}
.pt{font-family:'Syne',sans-serif;font-weight:600;font-size:13px;}.ps{font-size:11px;color:var(--tm);margin-left:auto;}
.cm{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;scroll-behavior:smooth;}
.cm::-webkit-scrollbar{width:3px;}.cm::-webkit-scrollbar-thumb{background:var(--b);border-radius:3px;}
.wc{background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:22px;text-align:center;}
.wi{font-size:30px;margin-bottom:10px;display:block;}
.wc h3{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin-bottom:7px;}
.wc p{font-size:13px;color:var(--tm);line-height:1.65;max-width:340px;margin:0 auto 14px;}
.sgs{display:flex;flex-direction:column;gap:7px;text-align:left;}
.sb{background:var(--s1);border:1px solid var(--b);color:var(--tm);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 14px;border-radius:9px;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:7px;line-height:1.5;width:100%;}
.sb:hover{border-color:var(--a);color:var(--t);background:rgba(59,130,246,.06);}
.sa{margin-left:auto;opacity:0;transition:opacity .2s;font-size:11px;color:var(--a);flex-shrink:0;}.sb:hover .sa{opacity:1;}
.msg{display:flex;gap:9px;animation:fu .3s ease both;}.msg.u{flex-direction:row-reverse;}
.av{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px;}
.msg.u .av{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.3);}
.msg.ai .av{background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 0 9px var(--ag);}
.bub{max-width:78%;padding:11px 15px;border-radius:11px;font-size:13px;line-height:1.75;}
.msg.u .bub{background:var(--a);color:#fff;border-bottom-right-radius:3px;}
.msg.ai .bub{background:var(--s2);border:1px solid var(--b);color:var(--t);border-bottom-left-radius:3px;}
.mt{font-size:10px;color:var(--td);margin-top:3px;}.msg.u .mt{text-align:right;}
.ty{display:flex;gap:4px;align-items:center;padding:2px 0;}
.ty span{width:5px;height:5px;background:var(--a);border-radius:50%;animation:bo 1.2s ease infinite;opacity:.6;}
.ty span:nth-child(2){animation-delay:.15s;}.ty span:nth-child(3){animation-delay:.3s;}
.sugg-row{display:flex;flex-direction:column;gap:6px;padding:2px 0 2px 36px;animation:fu .4s ease both;}
.sugg-label{font-size:10px;color:var(--td);margin-bottom:3px;letter-spacing:.5px;text-transform:uppercase;}
.sq{background:var(--s2);border:1px solid var(--b);color:var(--tm);font-family:'DM Sans',sans-serif;font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:6px;line-height:1.5;width:100%;}
.sq:hover{border-color:var(--a);color:var(--t);background:rgba(59,130,246,.06);}
.sq .sa{margin-left:auto;opacity:0;transition:opacity .2s;font-size:10px;color:var(--a);}.sq:hover .sa{opacity:1;}
.ia{padding:12px 16px 16px;border-top:1px solid var(--b);}
.ir{display:flex;gap:8px;align-items:flex-end;}
.ib{flex:1;background:var(--s2);border:1px solid var(--b);border-radius:11px;padding:11px 14px;color:var(--t);font-family:'DM Sans',sans-serif;font-size:13px;resize:none;outline:none;transition:border-color .2s;min-height:44px;max-height:110px;line-height:1.5;}
.ib::placeholder{color:var(--td);}.ib:focus{border-color:var(--a);}
.sn{width:44px;height:44px;background:var(--a);border:none;border-radius:11px;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;box-shadow:0 4px 12px rgba(59,130,246,.3);}
.sn:hover{background:#2563eb;transform:translateY(-1px);}.sn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.ih{font-size:11px;color:var(--td);margin-top:6px;}
footer{margin-top:32px;padding:16px 0 26px;border-top:1px solid var(--b);display:flex;justify-content:space-between;font-size:11px;color:var(--td);flex-wrap:wrap;gap:8px;}
@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes bo{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
@media(max-width:580px){.bub{max-width:88%;}}
</style>
</head>

<div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">
<header>
  <div class="lg">
    <div class="li">&#9672;</div>
    <div class="lt">BizClear <span>&middot;</span> 知识问答</div>
  </div>
  <div class="hb">ANA-Match</div>
</header>
<div class="hero">
  <div class="ey">商务透明度平台</div>
  <h1>关于 Asia &amp; NA Business<br>Matchmaking Session<br><em>&#xFF08;ANA-Match&#xFF09;</em>的提问</h1>
  <p class="hp">基于集团内部政策文件的智能问答系统，仅仅依据文件内容作答。</p>
  <div class="rgs">
    <div class="rt"><div class="rd de"></div>欧美商务</div>
    <div class="rt"><div class="rd dn"></div>北美工作室</div>
    <div class="rt"><div class="rd da"></div>亚洲工作室</div>
  </div>
</div>
<div class="cp">
  <div class="ph">
    <div class="pi">&#128172;</div>
    <div class="pt">提问区</div>
    <div class="ps" id="st">等待提问</div>
  </div>
  <div class="cm" id="cm">
    <div class="wc" id="welcome">
      <span class="wi">&#128269;</span>
      <h3>有什么想了解的？</h3>
      <p>以下是一些常见问题，点击即可直接提问，或在下方自由输入。<br><span style="font-size:12px;color:var(--td)">Feel free to ask in English too.</span></p>
      <div class="sgs" id="init-sgs"></div>
    </div>
  </div>
  <div class="ia">
    <div class="ir">
      <textarea class="ib" id="ui" placeholder="输入您的问题… / Ask your question in English too" rows="1"></textarea>
      <button class="sn" id="snd">&#10148;</button>
    </div>
    <div class="ih">Ctrl + Enter 发送</div>
  </div>
</div>
<footer>
  <span>&#169; 集团商务透明度知识平台</span>
  <span>由 Claude AI 驱动 &middot; 仅依据内部文件作答</span>
</footer>

      b.appendChild(s1); b.appendChild(s2);
      b.addEventListener('click',function(){ ui.value=q; send(); });
      row.appendChild(b);
    });
    cmEl.appendChild(row); cmEl.scrollTop=cmEl.scrollHeight;
  }
  function genSugg(q,a){
    api({model:'claude-sonnet-4-5',max_tokens:300,
      system:SUGG_SYS,
      messages:[{role:'user',content:'Current conversation - User asked: "'+q+'" / AI answered: "'+a+'"\n\nSuggest 3 follow-up questions that can be answered from the knowledge base. Write them in the same language as the user\'s question above.'}]
    }).then(function(d){
      var t=(d.content&&d.content[0]&&d.content[0].text)||'';
      var qs=t.split('\n').map(function(s){return s.trim();}).filter(function(s){return s.length>4;}).slice(0,3);
      if(qs.length) showSugg(qs);
    }).catch(function(){});
  }
  function send(){
    if(busy) return;
    var q=ui.value.trim(); if(!q) return;
    ui.value=''; ui.style.height='auto';
    busy=true; snd.disabled=true; stEl.textContent='AI \u601d\u8003\u4e2d\u2026';
    addMsg('u',q);
    var bub=addMsg('ai','');
    hist.push({role:'user',content:q});
    api({model:'claude-sonnet-4-5',max_tokens:1000,system:SYS,messages:hist})
      .then(function(d){
        var r=(d.content&&d.content[0]&&d.content[0].text)||'\u62b1\u6b49\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5\u3002';
        bub.innerHTML=fmt(r);
        hist.push({role:'assistant',content:r});
        genSugg(q,r);
      })
      .catch(function(){ bub.innerHTML='<span style="color:#ef4444">\u26A0 \u8fde\u63a5\u9519\u8bef\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5\u3002</span>'; })
      .finally(function(){ busy=false; snd.disabled=false; stEl.textContent='\u7b49\u5f85\u63d0\u95ee'; cmEl.scrollTop=99999; });
  }
})();

</script>
</body>
</html>
